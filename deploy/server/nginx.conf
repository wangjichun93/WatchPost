# =====================================================================
# 望哨 WATCHPOST · Nginx (服务器部署: 前端 SPA + /api 反代 + /ws WebSocket)
# 容器内监听 80, 宿主发布到 11580 (80/443 已被现有 Dify 栈占用)
# 上游 watchpost-app:1157 为 compose 网络内后端服务名
# =====================================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: 未匹配路由回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存 (Vite 产物带 hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理 → 后端
    location /api/ {
        proxy_pass http://watchpost-app:1157;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # WebSocket 实时推送
    location /ws/ {
        proxy_pass http://watchpost-app:1157;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Swagger / OpenAPI
    location ~ ^/(swagger-ui|v3/api-docs|swagger-ui.html) {
        proxy_pass http://watchpost-app:1157;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
