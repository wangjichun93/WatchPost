# =====================================================================
# 望哨 WATCHPOST · Nginx 配置 (v1 单机统一入口)
# 职责: 前端静态资源 (SPA) + /api 反向代理 + /ws WebSocket 升级 + TLS 终止(可选)
# 对应《系统架构设计 v1.0》§10.1 部署拓扑
# =====================================================================

# WebSocket 升级映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 生产建议: 强制跳转 HTTPS (启用下方 TLS server 后取消注释)
    # return 301 https://$host$request_uri;

    client_max_body_size 10m;

    # ---- 前端静态资源 (SPA: 未匹配路由回退 index.html) ----
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存 (Vite 构建产物带 hash, 可长缓存)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- API 反向代理 → watchpost-app:1157 ----
    location /api/ {
        proxy_pass http://watchpost-app:1157;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---- WebSocket 实时推送 → /ws/realtime ----
    location /ws/ {
        proxy_pass http://watchpost-app:1157;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;   # 长连接, 避免频繁断开
        proxy_send_timeout  3600s;
    }

    # ---- Swagger UI / OpenAPI (可选暴露; 生产建议限制内网) ----
    location ~ ^/(swagger-ui|v3/api-docs|swagger-ui.html) {
        proxy_pass http://watchpost-app:1157;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 健康检查 ----
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

