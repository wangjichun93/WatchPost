# =====================================================================
# 望哨 WATCHPOST · v1 单机部署 (Docker Compose)
# 对应《系统架构设计 v1.0》§10.1
# 服务: nginx(前端+TLS+反代) · watchpost-app(单体) · postgres · redis · iotdb(可选)
# 启动: docker compose up -d ; 访问 http://localhost:1157
# =====================================================================
services:
  # ---- 关系库: 元数据/告警/审计 ----
  postgres:
    image: postgres:16-alpine
    container_name: watchpost-postgres
    environment:
      POSTGRES_DB: watchpost
      POSTGRES_USER: watchpost
      POSTGRES_PASSWORD: ${WP_DB_PASSWORD:-watchpost}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchpost -d watchpost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis: 实时值/收敛状态/限流/登录锁定/验证码 ----
  redis:
    image: redis:7-alpine
    container_name: watchpost-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- 时序库 (可选; warehouse.store.type=iotdb 时启用) ----
  # 默认 warehouse.store.type=jpa 用 PostgreSQL 落盘, 无需此服务。
  # 生产建议启用 IoTDB 并改 WP store type。
  iotdb:
    image: apache/iotdb:1.3.7-standalone
    container_name: watchpost-iotdb
    ports:
      - "6667:6667"
    volumes:
      - iotdbdata:/iotdb/data
    profiles: ["tsdb"]      # docker compose --profile tsdb up -d 才启动
    restart: unless-stopped

  # ---- 望哨应用 (v1 单体: manager+collector+alerter 同进程) ----
  watchpost-app:
    image: watchpost:1.0.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: watchpost-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ---- 数据源 ----
      WP_DB_URL: jdbc:postgresql://postgres:5432/watchpost
      WP_DB_USER: watchpost
      WP_DB_PASSWORD: ${WP_DB_PASSWORD:-watchpost}
      # ---- Redis ----
      WP_REDIS_HOST: redis
      WP_REDIS_PORT: 6379
      # ---- 安全密钥 (生产务必用 secrets/环境注入, 勿用默认值) ----
      WP_JWT_SECRET: ${WP_JWT_SECRET:?请在 .env 设置 WP_JWT_SECRET (>=32字节)}
      WP_CRYPTO_KEY: ${WP_CRYPTO_KEY:?请在 .env 设置 WP_CRYPTO_KEY (凭据加密主密钥)}
      # ---- 引导管理员 ----
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin123}
      # ---- 存储/队列 ----
      WP_STORE_TYPE: ${WP_STORE_TYPE:-jpa}
      WP_QUEUE_TYPE: ${WP_QUEUE_TYPE:-memory}
      # ---- 邮件链接基址 ----
      WP_MAIL_BASE_URL: ${WP_MAIL_BASE_URL:-http://localhost:1157}
      TZ: Asia/Shanghai
      JAVA_OPTS: >-
        -Xms512m -Xmx1024m
        --add-opens=java.base/java.lang=ALL-UNNAMED
    ports:
      - "1157:1157"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1157/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ---- Nginx: 前端静态资源 (SPA) + /api 反代 + /ws WebSocket + TLS 终止 ----
  # 多阶段构建: Node 构建 web-app → Nginx 服务 dist。统一入口 http://localhost:80
  nginx:
    image: watchpost-web:1.0.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: watchpost-nginx
    depends_on:
      - watchpost-app
    ports:
      - "80:80"
      # TLS: 挂载证书到 ./certs 并启用 nginx.conf 中的 443 server 后放开
      # - "443:443"
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  iotdbdata:
